<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>📊 Zalo Ads Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{
 font-family:"Be Vietnam Pro", sans-serif;
 background:#0f172a;
 color:#fff;
 margin:0;
 padding:20px;
}
h1{
 text-align:center;
 margin-bottom:20px;
}
.card{
 background:#1e293b;
 padding:20px;
 border-radius:16px;
 margin-bottom:20px;
 box-shadow:0 10px 30px rgba(0,0,0,0.3);
}
.kpi{
 font-size:40px;
 font-weight:800;
}
.label{
 color:#94a3b8;
 font-size:13px;
}
</style>
</head>
<body>

<h1>📊 Zalo Click Dashboard</h1>

<div class="card">
 <div class="label">Tổng số click Zalo</div>
 <div class="kpi" id="totalClick">0</div>
</div>

<div class="card">
 <canvas id="chart"></canvas>
</div>

<script>
// ===== FIREBASE CONFIG (bạn thay thông tin của bạn) =====
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
};

// ===== LOAD FIREBASE =====
const script1 = document.createElement('script');
script1.src = "https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js";
document.head.appendChild(script1);

const script2 = document.createElement('script');
script2.src = "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js";
document.head.appendChild(script2);

script2.onload = () => {

 const app = firebase.initializeApp(firebaseConfig);
 const db = firebase.firestore();

 let labels = [];
 let values = [];

 db.collection("zalo_clicks").orderBy("time").get().then(snapshot => {

     let total = 0;
     let map = {};

     snapshot.forEach(doc => {
         const data = doc.data();
         total++;

         let date = new Date(data.time).toLocaleDateString();
         map[date] = (map[date] || 0) + 1;
     });

     document.getElementById("totalClick").innerText = total;

     labels = Object.keys(map);
     values = Object.values(map);

     new Chart(document.getElementById("chart"),{
         type:"line",
         data:{
             labels:labels,
             datasets:[{
                 label:"Clicks / Day",
                 data:values,
                 fill:true
             }]
         }
     });
 });
}
</script>

</body>
</html>
