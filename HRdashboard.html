<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body { background:#0e1117; color:#e8eaf0; font-family:Arial; padding:20px; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.card { background:#1e2535; padding:15px; border-radius:10px; }
.bar { height:6px; background:#333; border-radius:4px; overflow:hidden; margin:6px 0; }
.fill { height:100%; background:#34d399; }
canvas { background:#1e2535; border-radius:10px; padding:10px; }

/* modal */
#modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center;
}
.modal-box {
  background:#1e2535; padding:20px; border-radius:10px;
  width:600px; max-height:80vh; overflow:auto;
}
</style>
</head>

<body>

<h2>Warehouse Dashboard</h2>

<!-- TOTAL SUP CHART -->
<canvas id="supChart"></canvas>

<!-- SUP CARDS -->
<div class="grid" id="supGrid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// ================= LOAD =================
let RAW = [];

async function load(){
  const res = await fetch('dataHRdashboard.js?t='+Date.now());
  RAW = JSON.parse(await res.text());
  init();
}

// ================= HELP =================
function excelDate(n){
  if(!n || n==="0") return '';
  const d = new Date((Number(n)-25569)*86400*1000);
  return d.toLocaleDateString('vi-VN');
}

// ================= BUILD =================
function build(data){

  const today = new Date(); today.setHours(0,0,0,0);

  const map = {};

  data.forEach(e=>{

    if(!map[e.sup]){
      map[e.sup] = {
        name:e.sup,
        mgr:e.manager,
        total:0,
        perm:0,
        out:0,
        wsk:0,
        res:[]
      };
    }

    const s = map[e.sup];

    s.total++;
    if(e.check==='TTI') s.perm++;
    else s.out++;

    if(e.title==='Warehouse Shift Keeper') s.wsk++;

    if(e.lwd && e.lwd !== "0"){
      const d = new Date((Number(e.lwd)-25569)*86400*1000);

      s.res.push({
        name:e.name,
        id:e.id,
        lwd:excelDate(e.lwd),
        type: d<today?'red':'yellow'
      });
    }

  });

  return Object.values(map).sort((a,b)=>b.total-a.total);
}

// ================= MODAL =================
function showModal(title,list){

  modal.style.display='flex';
  modalTitle.innerText = title;

  modalBody.innerHTML = list.map(e=>`
    <div style="padding:6px;border-bottom:1px solid #333">
      ${e.name} - ${e.id} - ${e.lwd||''}
    </div>
  `).join('');
}

modal.onclick=()=>modal.style.display='none';

// ================= RENDER =================
let chart;

function init(){

  const sups = build(RAW);

  // ===== TOTAL SUP CHART =====
  chart = new Chart(supChart,{
    type:'bar',
    data:{
      labels:sups.map(s=>s.name),
      datasets:[{data:sups.map(s=>s.total)}]
    },
    options:{
      onClick:(e,el)=>{
        if(!el.length) return;
        const idx = el[0].index;
        const sup = sups[idx];

        const list = RAW.filter(x=>x.sup===sup.name)
          .map(x=>({
            name:x.name,
            id:x.id,
            lwd:excelDate(x.lwd)
          }));

        showModal("SUP: "+sup.name, list);
      }
    }
  });

  // ===== SUP CARDS =====
  supGrid.innerHTML = sups.map((s,i)=>{

    const permPct = Math.round(s.perm/s.total*100);

    return `
    <div class="card">

      <b>${s.name}</b><br>
      <small>Mgr: ${s.mgr}</small><br><br>

      Total: ${s.total} | Perm: ${s.perm} | Out: ${s.out}

      <div class="bar">
        <div class="fill" style="width:${permPct}%"></div>
      </div>

      <small>Permanent ${permPct}%</small><br>
      <small>Shift Keeper: ${s.wsk}</small><br><br>

      <!-- MINI CHART -->
      <canvas id="mini${i}" height="80"></canvas>

      <div style="margin-top:8px">
        ${
          s.res.length===0
          ? '<small>No resignation</small>'
          : s.res.map(r=>`
            <div style="color:${r.type==='red'?'#f87171':'#fbbf24'};font-size:12px">
              ${r.name} - ${r.id} - ${r.lwd}
            </div>
          `).join('')
        }
      </div>

    </div>
    `;

  }).join('');

  // ===== MINI CHART EACH SUP =====
  sups.forEach((s,i)=>{

    const ctx = document.getElementById('mini'+i);

    new Chart(ctx,{
      type:'doughnut',
      data:{
        labels:['Perm','Out'],
        datasets:[{data:[s.perm,s.out]}]
      },
      options:{
        plugins:{legend:{display:false}},
        onClick:()=>{
          const list = RAW.filter(x=>x.sup===s.name);
          showModal("SUP DETAIL: "+s.name, list);
        }
      }
    });

  });

}

load();

</script>

</body>
</html>
