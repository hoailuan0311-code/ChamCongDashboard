<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard BI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
:root{
  --bg:#0e1117;
  --card:#1e2535;
  --text:#e8eaf0;
  --sub:#8b92a8;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Segoe UI';
  padding:24px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

/* KPI */
.kpi{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.kpi-card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
}

/* ===== CHART LAYOUT FIX ===== */
.chart-row{
  display:grid;
  grid-template-columns:220px 220px 1fr;
  gap:16px;
  margin-bottom:20px;
}

.chart-box{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  height:220px;   /* FIX SIZE */
}

.chart-box.large{
  height:260px;
}

/* IMPORTANT */
canvas{
  width:100% !important;
  height:100% !important;
}

/* SUP */
.sup-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.sup-card{
  background:var(--card);
  padding:15px;
  border-radius:12px;
}

.bar{
  height:6px;background:#333;border-radius:4px;margin:6px 0;
}
.fill{height:100%;background:#34d399;}

/* MODAL */
#modal{
  position:fixed; inset:0;
  background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center;
}
.modal-box{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  width:650px;
  max-height:80vh;
  overflow:auto;
}
</style>
</head>

<body>

<div class="header">
  <h2>Warehouse Dashboard</h2>
  <small id="time"></small>
</div>

<!-- KPI -->
<div class="kpi" id="kpi"></div>

<!-- CHART -->
<div class="chart-row">
  <div class="chart-box"><canvas id="buChart"></canvas></div>
  <div class="chart-box"><canvas id="mgrChart"></canvas></div>
  <div class="chart-box large"><canvas id="supChart"></canvas></div>
</div>

<!-- SUP -->
<div class="sup-grid" id="supGrid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// ===== LOAD =====
let RAW=[];
fetch('dataHRdashboard.js?t='+Date.now())
.then(r=>r.text())
.then(t=>{
  RAW=JSON.parse(t);
  init();
});

// ===== DATE =====
function formatDate(n){
  if(!n||n==="0") return '';
  return new Date((n-25569)*86400*1000).toLocaleDateString('vi-VN');
}

// ===== BUILD =====
function build(data){

  const today=new Date(); today.setHours(0,0,0,0);

  const bu={}, mgr={}, sup={};

  data.forEach(e=>{
    bu[e.bu]=(bu[e.bu]||0)+1;
    mgr[e.manager]=(mgr[e.manager]||0)+1;

    if(!sup[e.sup]){
      sup[e.sup]={name:e.sup,manager:e.manager,total:0,perm:0,out:0,res:[]};
    }

    const s=sup[e.sup];
    s.total++;

    if(e.check==='TTI') s.perm++;
    else s.out++;

    if(e.lwd && e.lwd!=="0"){
      const d=new Date((e.lwd-25569)*86400*1000);
      s.res.push({
        id:e.id,
        name:e.name,
        lwd:formatDate(e.lwd),
        type:d<today?'red':'yellow'
      });
    }

  });

  return {bu,mgr,sups:Object.values(sup).sort((a,b)=>b.total-a.total)};
}

// ===== MODAL =====
function show(title,list){
  modal.style.display='flex';
  modalTitle.innerText=title;

  modalBody.innerHTML=list.map(e=>`
    <div style="padding:6px;border-bottom:1px solid #333">
      ${e.id} - ${e.name} ${e.lwd?'- '+e.lwd:''}
    </div>
  `).join('');
}
modal.onclick=()=>modal.style.display='none';

// ===== INIT =====
function init(){

  time.innerText=new Date().toLocaleString('vi-VN');

  const {bu,mgr,sups}=build(RAW);

  // KPI
  const total=RAW.length;
  const perm=RAW.filter(x=>x.check==='TTI').length;

  kpi.innerHTML=`
    <div class="kpi-card">Total<br><b>${total}</b></div>
    <div class="kpi-card">Permanent<br><b>${perm}</b></div>
    <div class="kpi-card">Outsource<br><b>${total-perm}</b></div>
    <div class="kpi-card">Supervisor<br><b>${sups.length}</b></div>
  `;

  // ===== BU =====
  new Chart(buChart,{
    type:'doughnut',
    data:{labels:Object.keys(bu),datasets:[{data:Object.values(bu)}]},
    options:{
      maintainAspectRatio:false,
      onClick:(e,el)=>{
        if(!el.length)return;
        const k=Object.keys(bu)[el[0].index];
        show("BU: "+k, RAW.filter(x=>x.bu===k));
      }
    }
  });

  // ===== MANAGER =====
  new Chart(mgrChart,{
    type:'doughnut',
    data:{labels:Object.keys(mgr),datasets:[{data:Object.values(mgr)}]},
    options:{
      maintainAspectRatio:false,
      onClick:(e,el)=>{
        if(!el.length)return;
        const k=Object.keys(mgr)[el[0].index];
        show("Manager: "+k, RAW.filter(x=>x.manager===k));
      }
    }
  });

  // ===== SUP BAR =====
  new Chart(supChart,{
    type:'bar',
    data:{
      labels:sups.map(s=>s.name),
      datasets:[{data:sups.map(s=>s.total)}]
    },
    options:{
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      onClick:(e,el)=>{
        if(!el.length)return;
        const s=sups[el[0].index];
        show("SUP: "+s.name, RAW.filter(x=>x.sup===s.name));
      }
    }
  });

  // ===== SUP CARD =====
  supGrid.innerHTML=sups.map(s=>{
    const pct=Math.round(s.perm/s.total*100);
    return `
    <div class="sup-card">
      <b>${s.name}</b><br>
      <small style="color:#8b92a8">Manager: ${s.manager}</small><br><br>

      Total: ${s.total} | Permanent: ${s.perm} | Outsource: ${s.out}

      <div class="bar"><div class="fill" style="width:${pct}%"></div></div>

      ${
        s.res.map(r=>`
          <div style="color:${r.type==='red'?'#f87171':'#fbbf24'};font-size:12px">
            ${r.id} - ${r.name} - ${r.lwd}
          </div>
        `).join('')
      }
    </div>
    `;
  }).join('');

}
</script>

</body>
</html>
