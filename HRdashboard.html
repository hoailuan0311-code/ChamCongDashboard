<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body { font-family:'Be Vietnam Pro'; background:#0e1117; color:#e8eaf0; padding:20px; }
.section { margin:20px 0; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.card { background:#1e2535; padding:15px; border-radius:10px; }
.sup-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.bar { height:6px; background:#333; border-radius:4px; overflow:hidden; }
.fill { height:100%; background:#34d399; }
.small { font-size:12px; color:#aaa; }
.red { color:#f87171; }
.yellow { color:#fbbf24; }
</style>
</head>

<body>

<h2>Warehouse Headcount Dashboard</h2>

<!-- METRICS -->
<div class="section grid" id="metrics"></div>

<!-- CHART -->
<div class="section">
  <canvas id="buChart"></canvas>
</div>

<!-- SUP -->
<div class="section">
  <div class="sup-grid" id="supGrid"></div>
</div>

<script>
// ================= LOAD =================
let RAW = [];

async function loadData(){
  const res = await fetch('dataHRdashboard.js?t='+Date.now());
  RAW = JSON.parse(await res.text());
  init();
}

// ================= PROCESS =================
function process(data){

  const today = new Date();
  today.setHours(0,0,0,0);

  const map = {};

  data.forEach(e=>{

    if(!map[e.sup]){
      map[e.sup] = {
        name:e.sup,
        mgr:e.manager,
        total:0,
        perm:0,
        out:0,
        wsk:0,
        already:0,
        upcoming:0,
        res:[]
      };
    }

    const s = map[e.sup];
    s.total++;

    if(e.check==='TTI') s.perm++;
    else s.out++;

    if(e.title==='Warehouse Shift Keeper') s.wsk++;

    if(e.lwd && e.lwd !== "0"){
      const d = new Date(e.lwd);
      if(d < today){
        s.already++;
        s.res.push({name:e.name,lwd:e.lwd,type:'red'});
      } else {
        s.upcoming++;
        s.res.push({name:e.name,lwd:e.lwd,type:'yellow'});
      }
    }

  });

  return Object.values(map).sort((a,b)=>b.total-a.total);
}

// ================= RENDER =================
function init(){

  if(!RAW.length){
    document.body.innerHTML="No data";
    return;
  }

  const sups = process(RAW);

  // ===== METRICS =====
  const total = RAW.length;
  const perm = RAW.filter(e=>e.check==='TTI').length;
  const out = total - perm;

  metrics.innerHTML = `
    <div class="card">Total<br><b>${total}</b></div>
    <div class="card">Permanent<br><b>${perm}</b></div>
    <div class="card">Outsource<br><b>${out}</b></div>
    <div class="card">Supervisor<br><b>${sups.length}</b></div>
  `;

  // ===== BU CHART =====
  const buMap = {};
  RAW.forEach(e=>buMap[e.bu]=(buMap[e.bu]||0)+1);

  new Chart(buChart,{
    type:'doughnut',
    data:{labels:Object.keys(buMap),datasets:[{data:Object.values(buMap)}]}
  });

  // ===== SUP CARD =====
  supGrid.innerHTML = sups.map(s=>{

    const permPct = Math.round(s.perm/s.total*100);

    return `
      <div class="card">

        <b>${s.name}</b><br>
        <span class="small">Mgr: ${s.mgr}</span><br><br>

        Total: ${s.total} | Perm: ${s.perm} | Out: ${s.out}<br><br>

        <div class="small">Permanent ${permPct}%</div>
        <div class="bar"><div class="fill" style="width:${permPct}%"></div></div>

        <div class="small" style="margin-top:8px">
          Shift Keeper: ${s.wsk}
        </div>

        <div style="margin-top:10px">
          <span class="yellow">Upcoming: ${s.upcoming}</span> |
          <span class="red">Resigned: ${s.already}</span>
        </div>

        <div style="margin-top:8px">
          ${
            s.res.length===0
            ? '<span class="small">No resignation</span>'
            : s.res.map(r=>`
              <div class="small ${r.type}">
                ${r.name} - ${r.lwd}
              </div>
            `).join('')
          }
        </div>

      </div>
    `;
  }).join('');

}

loadData();

</script>

</body>
</html>
