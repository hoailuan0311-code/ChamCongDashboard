<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
/* ===== GIỮ NGUYÊN STYLE CỦA BẠN ===== */
body { font-family: 'Be Vietnam Pro'; background:#0e1117; color:#e8eaf0; padding:20px; }
.section-label { font-size:12px; margin:10px 0; color:#888; }
.metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.metric { background:#1e2535; padding:15px; border-radius:10px; }
.chart-card { background:#1e2535; padding:15px; border-radius:10px; }
.sup-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:20px; }
.sup-card { background:#1e2535; padding:15px; border-radius:10px; }
</style>
</head>

<body>

<h2>Warehouse Headcount Dashboard</h2>

<div class="section-label">Tổng quan</div>
<div class="metrics" id="metrics"></div>

<div class="section-label">Phân bổ</div>
<div style="display:grid;grid-template-columns:1fr 1fr; gap:10px;">
  <div class="chart-card"><canvas id="buChart"></canvas></div>
  <div class="chart-card"><canvas id="mgrChart"></canvas></div>
</div>

<div class="chart-card" style="margin-top:10px">
  <canvas id="supChart"></canvas>
</div>

<div class="section-label">Supervisor</div>
<div class="sup-grid" id="supGrid"></div>

<script>

// ================= LOAD DATA =================
let RAW = [];

async function loadData(){
  try{
    const res = await fetch('dataHRdashboard.js?t='+Date.now());
    const text = await res.text();
    RAW = JSON.parse(text);

    console.log("DATA:", RAW);

    initDashboard();

  }catch(e){
    console.error(e);
    document.body.innerHTML = "Load data failed";
  }
}

// ================= PROCESS =================
function buildSups(data){

  const map = {};

  data.forEach(e => {

    if (!map[e.sup]) {
      map[e.sup] = {
        name: e.sup,
        mgr: e.manager,
        total: 0,
        permanent: 0,
        outsource: 0
      };
    }

    const s = map[e.sup];

    s.total++;
    if(e.check === 'TTI') s.permanent++;
    else s.outsource++;

  });

  return Object.values(map).sort((a,b)=>b.total-a.total);
}

// ================= RENDER =================
let chartBU, chartMgr, chartSup;

function initDashboard(){

  if(!RAW || RAW.length===0){
    document.body.innerHTML="No data";
    return;
  }

  const sups = buildSups(RAW);

  // ===== METRICS =====
  const total = RAW.length;
  const perm = RAW.filter(e=>e.check==='TTI').length;
  const out = total - perm;

  metrics.innerHTML = `
    <div class="metric">Total: ${total}</div>
    <div class="metric">Permanent: ${perm}</div>
    <div class="metric">Outsource: ${out}</div>
    <div class="metric">Supervisor: ${sups.length}</div>
  `;

  // ===== BU =====
  const buMap = {};
  RAW.forEach(e=> buMap[e.bu]=(buMap[e.bu]||0)+1);

  chartBU = new Chart(buChart,{
    type:'doughnut',
    data:{labels:Object.keys(buMap),datasets:[{data:Object.values(buMap)}]}
  });

  // ===== MANAGER =====
  const mgrMap = {};
  RAW.forEach(e=> mgrMap[e.manager]=(mgrMap[e.manager]||0)+1);

  chartMgr = new Chart(mgrChart,{
    type:'doughnut',
    data:{labels:Object.keys(mgrMap),datasets:[{data:Object.values(mgrMap)}]}
  });

  // ===== SUP =====
  chartSup = new Chart(supChart,{
    type:'bar',
    data:{
      labels:sups.map(s=>s.name),
      datasets:[{data:sups.map(s=>s.total)}]
    }
  });

  // ===== SUP CARD =====
  supGrid.innerHTML = sups.map(s=>`
    <div class="sup-card">
      <b>${s.name}</b><br>
      Mgr: ${s.mgr}<br><br>
      Total: ${s.total}<br>
      Permanent: ${s.permanent}<br>
      Outsource: ${s.outsource}
    </div>
  `).join('');

}

// ================= INIT =================
loadData();

</script>

</body>
</html>
