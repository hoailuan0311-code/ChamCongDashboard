<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body { background:#0e1117; color:#e8eaf0; font-family:Arial; padding:20px; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
.card { background:#1e2535; padding:15px; border-radius:10px; }
.bar { height:6px; background:#333; border-radius:4px; overflow:hidden; margin:6px 0; }
.fill { height:100%; background:#34d399; }
canvas { background:#1e2535; border-radius:10px; padding:10px; }

/* top charts */
.top { display:grid; grid-template-columns:200px 200px 1fr; gap:15px; }

/* modal */
#modal {
  position:fixed; inset:0;
  background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center;
}
.modal-box {
  background:#1e2535; padding:20px; border-radius:10px;
  width:600px; max-height:80vh; overflow:auto;
}
</style>
</head>

<body>

<h2>Warehouse Dashboard</h2>

<div class="top">
  <canvas id="buChart"></canvas>
  <canvas id="mgrChart"></canvas>
  <canvas id="supChart"></canvas>
</div>

<div class="grid" id="supGrid"></div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// ===== LOAD =====
let RAW=[];
fetch('dataHRdashboard.js?t='+Date.now())
.then(r=>r.text())
.then(t=>{
  RAW = JSON.parse(t);
  init();
});

// ===== DATE =====
function formatDate(n){
  if(!n || n==="0") return '';
  const d = new Date((Number(n)-25569)*86400*1000);
  return d.toLocaleDateString('vi-VN');
}

// ===== BUILD =====
function build(data){

  const today=new Date(); today.setHours(0,0,0,0);

  const supMap={}, buMap={}, mgrMap={};

  data.forEach(e=>{

    buMap[e.bu]=(buMap[e.bu]||0)+1;
    mgrMap[e.manager]=(mgrMap[e.manager]||0)+1;

    if(!supMap[e.sup]){
      supMap[e.sup]={
        name:e.sup,
        manager:e.manager,
        total:0, perm:0, out:0, wsk:0, res:[]
      };
    }

    const s=supMap[e.sup];
    s.total++;

    if(e.check==='TTI') s.perm++;
    else s.out++;

    if(e.title==='Warehouse Shift Keeper') s.wsk++;

    if(e.lwd && e.lwd!=="0"){
      const d=new Date((Number(e.lwd)-25569)*86400*1000);
      s.res.push({
        id:e.id,
        name:e.name,
        lwd:formatDate(e.lwd),
        type:d<today?'red':'yellow'
      });
    }

  });

  return {
    sups:Object.values(supMap).sort((a,b)=>b.total-a.total),
    buMap, mgrMap
  };
}

// ===== MODAL =====
function show(title,list){
  modal.style.display='flex';
  modalTitle.innerText=title;

  modalBody.innerHTML=list.map(e=>`
    <div style="padding:6px;border-bottom:1px solid #333">
      ${e.id} - ${e.name} ${e.lwd?'- '+e.lwd:''}
    </div>
  `).join('');
}
modal.onclick=()=>modal.style.display='none';

// ===== INIT =====
function init(){

  const {sups,buMap,mgrMap}=build(RAW);

  // ===== BU DONUT =====
  new Chart(buChart,{
    type:'doughnut',
    data:{labels:Object.keys(buMap),datasets:[{data:Object.values(buMap)}]},
    options:{
      onClick:(e,el)=>{
        if(!el.length)return;
        const k=Object.keys(buMap)[el[0].index];
        show("BU: "+k, RAW.filter(x=>x.bu===k));
      }
    }
  });

  // ===== MANAGER DONUT =====
  new Chart(mgrChart,{
    type:'doughnut',
    data:{labels:Object.keys(mgrMap),datasets:[{data:Object.values(mgrMap)}]},
    options:{
      onClick:(e,el)=>{
        if(!el.length)return;
        const k=Object.keys(mgrMap)[el[0].index];
        show("Manager: "+k, RAW.filter(x=>x.manager===k));
      }
    }
  });

  // ===== SUP BAR =====
  new Chart(supChart,{
    type:'bar',
    data:{
      labels:sups.map(s=>s.name),
      datasets:[{
        data:sups.map(s=>s.total)
      }]
    },
    options:{
      plugins:{
        legend:{display:false}
      },
      onClick:(e,el)=>{
        if(!el.length)return;
        const sup=sups[el[0].index];
        show("SUP: "+sup.name, RAW.filter(x=>x.sup===sup.name));
      },
      animation:{
        onComplete:function(){
          const chart=this.chart;
          const ctx=chart.ctx;
          chart.data.datasets.forEach((dataset,i)=>{
            const meta=chart.getDatasetMeta(i);
            meta.data.forEach((bar,index)=>{
              ctx.fillStyle="#fff";
              ctx.fillText(dataset.data[index], bar.x-5, bar.y-5);
            });
          });
        }
      }
    }
  });

  // ===== SUP CARD =====
  supGrid.innerHTML=sups.map(s=>{

    const pct=Math.round(s.perm/s.total*100);

    return `
    <div class="card">

      <b>${s.name}</b><br>
      <small>Manager: ${s.manager}</small><br><br>

      Total: ${s.total} | Permanent: ${s.perm} | Outsource: ${s.out}

      <div class="bar">
        <div class="fill" style="width:${pct}%"></div>
      </div>

      <small>Permanent ${pct}%</small><br>
      <small>Shift Keeper: ${s.wsk}</small><br><br>

      ${
        s.res.length===0
        ? '<small>No resignation</small>'
        : s.res.map(r=>`
          <div style="color:${r.type==='red'?'#f87171':'#fbbf24'};font-size:12px">
            ${r.id} - ${r.name} - ${r.lwd}
          </div>
        `).join('')
      }

    </div>
    `;
  }).join('');

}
</script>

</body>
</html>
