<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
body { background:#0e1117; color:#e8eaf0; font-family:Arial; padding:20px; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.card { background:#1e2535; padding:15px; border-radius:10px; }
select { margin-right:5px; padding:5px; }
canvas { background:#1e2535; padding:10px; border-radius:10px; margin-top:10px; }

/* modal */
#modal {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.7);
  display:none; align-items:center; justify-content:center;
}
.modal-box {
  background:#1e2535; padding:20px; border-radius:10px;
  max-height:80vh; overflow:auto; width:600px;
}
</style>
</head>

<body>

<h2>Warehouse Dashboard</h2>

<!-- FILTER -->
<select id="fBU"></select>
<select id="fMgr"></select>
<select id="fSup"></select>

<!-- METRICS -->
<div class="grid" id="metrics"></div>

<!-- CHART -->
<canvas id="buChart"></canvas>
<canvas id="supChart"></canvas>
<canvas id="resignChart"></canvas>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
  </div>
</div>

<script>

// ================= LOAD =================
let RAW = [];

async function load(){
  const res = await fetch('dataHRdashboard.js?t='+Date.now());
  RAW = JSON.parse(await res.text());

  init();
}

// ================= NORMALIZE =================
function norm(d){
  return d.map(e=>({
    bu:e.bu,
    name:e.name,
    sup:e.sup,
    manager:e.manager,
    title:e.title,
    check:e.check,
    lwd: e.lwd && e.lwd!=="0" ? new Date((e.lwd-25569)*86400*1000) : null
  }));
}

// ================= FILTER =================
function applyFilter(data){
  return data.filter(e =>
    (!fBU.value || e.bu===fBU.value) &&
    (!fMgr.value || e.manager===fMgr.value) &&
    (!fSup.value || e.sup===fSup.value)
  );
}

// ================= BUILD =================
function build(data){

  const today = new Date(); today.setHours(0,0,0,0);

  const bu={}, sup={}, resign={already:[], upcoming:[]};

  data.forEach(e=>{
    bu[e.bu]=(bu[e.bu]||0)+1;

    if(!sup[e.sup]) sup[e.sup]={total:0};
    sup[e.sup].total++;

    if(e.lwd){
      if(e.lwd < today) resign.already.push(e);
      else resign.upcoming.push(e);
    }
  });

  return {bu,sup,resign};
}

// ================= RENDER =================
let chartBU, chartSup, chartResign;

function render(){

  const data = applyFilter(norm(RAW));
  const r = build(data);

  // metrics
  metrics.innerHTML = `
    <div class="card">Total: ${data.length}</div>
    <div class="card">Resigned: ${r.resign.already.length}</div>
    <div class="card">Upcoming: ${r.resign.upcoming.length}</div>
    <div class="card">Sup: ${Object.keys(r.sup).length}</div>
  `;

  // destroy
  chartBU && chartBU.destroy();
  chartSup && chartSup.destroy();
  chartResign && chartResign.destroy();

  // BU chart
  chartBU = new Chart(buChart,{
    type:'doughnut',
    data:{labels:Object.keys(r.bu),datasets:[{data:Object.values(r.bu)}]},
    options:{
      onClick:(e,el)=>{
        if(!el.length) return;
        const label = chartBU.data.labels[el[0].index];
        showModal("BU: "+label, data.filter(x=>x.bu===label));
      }
    }
  });

  // SUP chart
  chartSup = new Chart(supChart,{
    type:'bar',
    data:{
      labels:Object.keys(r.sup),
      datasets:[{data:Object.values(r.sup).map(s=>s.total)}]
    },
    options:{
      onClick:(e,el)=>{
        if(!el.length) return;
        const label = chartSup.data.labels[el[0].index];
        showModal("SUP: "+label, data.filter(x=>x.sup===label));
      }
    }
  });

  // RESIGN chart
  chartResign = new Chart(resignChart,{
    type:'doughnut',
    data:{
      labels:['Already','Upcoming'],
      datasets:[{data:[r.resign.already.length, r.resign.upcoming.length]}]
    },
    options:{
      onClick:(e,el)=>{
        if(!el.length) return;
        const idx = el[0].index;
        const list = idx===0 ? r.resign.already : r.resign.upcoming;
        showModal(idx===0?"Đã nghỉ":"Sắp nghỉ", list);
      }
    }
  });

}

// ================= MODAL =================
function showModal(title, list){

  modal.style.display="flex";
  modalTitle.innerText = title;

  modalBody.innerHTML = list.map(e=>`
    <div style="border-bottom:1px solid #333;padding:6px 0">
      ${e.name} | ${e.sup} | ${e.bu}
    </div>
  `).join('');

}

modal.onclick = ()=> modal.style.display="none";

// ================= FILTER INIT =================
function initFilter(data){

  const set = (arr)=> [...new Set(arr)];

  fBU.innerHTML = '<option value="">BU</option>' + set(data.map(e=>e.bu)).map(v=>`<option>${v}</option>`).join('');
  fMgr.innerHTML = '<option value="">Manager</option>' + set(data.map(e=>e.manager)).map(v=>`<option>${v}</option>`).join('');
  fSup.innerHTML = '<option value="">Sup</option>' + set(data.map(e=>e.sup)).map(v=>`<option>${v}</option>`).join('');

}

// ================= INIT =================
function init(){

  const data = norm(RAW);

  initFilter(data);

  [fBU,fMgr,fSup].forEach(x=>x.onchange=render);

  render();
}

load();

</script>

</body>
</html>
