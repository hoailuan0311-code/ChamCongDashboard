<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>HR Dashboard BI PRO</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<style>
:root{
  --bg:#0e1117;
  --card:#1e2535;
  --text:#e8eaf0;
  --sub:#8b92a8;
}

body{background:var(--bg);color:var(--text);font-family:'Segoe UI';padding:24px;}

.header{display:flex;justify-content:space-between;margin-bottom:15px;}

.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card);padding:15px;border-radius:12px;}

.chart-row{
  display:grid;
  grid-template-columns:220px 220px 1fr;
  gap:16px;
  margin-bottom:10px;
}

.chart-box{
  background:var(--card);
  border-radius:12px;
  padding:12px;
  height:220px;
}

.chart-box.large{height:260px;}

canvas{width:100%!important;height:100%!important;}

.btn{
  background:#4f8ef7;border:none;color:#fff;padding:8px 12px;
  border-radius:6px;cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
  <h2>Warehouse Dashboard</h2>
  <button class="btn" onclick="exportExcel()">Export Excel</button>
</div>

<div class="kpi" id="kpi"></div>

<div class="chart-row">
  <div class="chart-box"><canvas id="buChart"></canvas></div>
  <div class="chart-box"><canvas id="mgrChart"></canvas></div>
  <div class="chart-box large"><canvas id="supChart"></canvas></div>
</div>

<!-- STACKED BAR -->
<div class="chart-box large">
  <canvas id="stackChart"></canvas>
</div>

<script>

// ===== LOAD =====
let RAW=[];
fetch('dataHRdashboard.js?t='+Date.now())
.then(r=>r.text())
.then(t=>{
  RAW=JSON.parse(t);
  init();
});

// ===== BUILD =====
function build(data){

  const bu={}, mgr={}, sup={};

  data.forEach(e=>{
    bu[e.bu]=(bu[e.bu]||0)+1;
    mgr[e.manager]=(mgr[e.manager]||0)+1;

    if(!sup[e.sup]){
      sup[e.sup]={name:e.sup,perm:0,out:0,total:0};
    }

    const s=sup[e.sup];
    s.total++;

    if(e.check==='TTI') s.perm++;
    else s.out++;
  });

  return {bu,mgr,sups:Object.values(sup)};
}

// ===== INIT =====
function init(){

  const {bu,mgr,sups}=build(RAW);

  // KPI
  const total=RAW.length;
  const perm=RAW.filter(x=>x.check==='TTI').length;

  kpi.innerHTML=`
    <div class="kpi-card">Total<br><b>${total}</b></div>
    <div class="kpi-card">Permanent<br><b>${perm}</b></div>
    <div class="kpi-card">Outsource<br><b>${total-perm}</b></div>
    <div class="kpi-card">Supervisor<br><b>${sups.length}</b></div>
  `;

  // ===== DONUT STYLE FIX =====
  const donutOpt = {
    maintainAspectRatio:false,
    plugins:{
      legend:{
        position:'bottom',
        labels:{color:'#aaa',boxWidth:12}
      }
    }
  };

  new Chart(buChart,{
    type:'doughnut',
    data:{labels:Object.keys(bu),datasets:[{data:Object.values(bu)}]},
    options:donutOpt
  });

  new Chart(mgrChart,{
    type:'doughnut',
    data:{labels:Object.keys(mgr),datasets:[{data:Object.values(mgr)}]},
    options:donutOpt
  });

  // ===== SUP BAR =====
  new Chart(supChart,{
    type:'bar',
    data:{
      labels:sups.map(s=>s.name),
      datasets:[{data:sups.map(s=>s.total)}]
    },
    options:{maintainAspectRatio:false}
  });

  // ===== STACKED BAR =====
  new Chart(stackChart,{
    type:'bar',
    data:{
      labels:sups.map(s=>s.name),
      datasets:[
        {
          label:'Permanent',
          data:sups.map(s=>s.perm),
          backgroundColor:'#34d399'
        },
        {
          label:'Outsource',
          data:sups.map(s=>s.out),
          backgroundColor:'#fbbf24'
        }
      ]
    },
    options:{
      maintainAspectRatio:false,
      responsive:true,
      scales:{
        x:{stacked:true},
        y:{stacked:true}
      }
    }
  });

}

// ===== EXPORT =====
function exportExcel(){

  const rows = RAW.map(e=>[
    e.id,e.name,e.bu,e.manager,e.sup,e.title,e.type,e.lwd
  ]);

  let csv="ID,Name,BU,Manager,Sup,Title,Type,LWD\n";

  rows.forEach(r=>{
    csv+=r.join(",")+"\n";
  });

  const blob=new Blob([csv],{type:"text/csv"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="HR_Dashboard.csv";
  a.click();
}

</script>

</body>
</html>
